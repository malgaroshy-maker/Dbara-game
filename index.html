<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Zoom is deliberately left enabled. A player who needs larger text needs
         it most on a screen that is mostly Arabic prose, and locking the scale
         is a WCAG 1.4.4 failure. The map's own pinch-to-zoom does not depend on
         this: it claims two-finger gestures itself in useMapViewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="description" content="دبارة - لعبة المسابقات والألغاز الليبية التفاعلية واستكشاف خريطة المدن والتراث" />
    <title>دبارة | لغز ومعرفة ليبية</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="دبارة" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Google Fonts for Arabic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Rubik:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-night-900 text-ink-100 antialiased selection:bg-gold-400/30 selection:text-gold-300 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Production builds only. On the Vite dev server a service worker
      // intercepts the module graph and serves stale code, so edits silently
      // stop applying — and any worker left over from a previous run is undone.
      if ('serviceWorker' in navigator) {
        if (import.meta.env.PROD) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        } else {
          navigator.serviceWorker
            .getRegistrations()
            .then((regs) => regs.forEach((reg) => reg.unregister()))
            .catch(() => {});
        }
      }
    </script>
  </body>
</html>
